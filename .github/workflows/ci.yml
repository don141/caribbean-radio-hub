name: CI

# Monorepo CI: the `build` job validates the Next.js web app + Firebase toolchain
# (existing, branch-protection-required check). The `mobile` job validates the
# Flutter app at apps/mobile with `flutter analyze` + `flutter test` (BRE-49).
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  # NOTE: keep this job id `build` and do NOT add a custom `name:` — the
  # branch-protection required status check on `main` matches the context "build".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
